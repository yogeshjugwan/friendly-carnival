services:
  - type: web
    name: random-call-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @rc/server start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        # Exact origins or wildcard hosts, comma separated. Update after the first Vercel deploy.
        value: https://*.vercel.app,http://localhost:3000
      # TURN relay (e.g. Metered.ca free tier). Set the values in the Render dashboard.
      # TURN with short-lived credentials (pick one provider): Cloudflare …
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      # … or Metered (e.g. myapp.metered.live + API key).
      - key: METERED_DOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Phase 3 (safety). Render generates random values for these on first sync;
      # read ADMIN_TOKEN in the dashboard to sign in at /admin.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: IP_SALT
        generateValue: true
      # Postgres for reports/bans/blocks/appeals (e.g. a free Neon database).
      # Without it, safety data lives in memory and is lost on every restart.
      - key: DATABASE_URL
        sync: false
      # Phase 4 (accounts). Links in emails point here.
      - key: WEB_URL
        value: https://call-random-call.vercel.app
      # Free users' daily matches (0 = no limit) and the rewarded-video top-up.
      - key: FREE_DAILY_MATCHES
        value: "30"
      - key: REWARD_AD_MATCHES
        value: "10"
      # "Continue with Google" (Google Cloud OAuth client); the button is hidden until both are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # https://resend.com API key; without it, emails are printed to the server log.
      - key: RESEND_API_KEY
        sync: false
      # Sender, e.g. "randomCall <hello@yourdomain.com>" once your domain is verified in Resend.
      - key: MAIL_FROM
        sync: false
      # Plus (Stripe). Billing stays off until all five are set.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_WEEK
        sync: false
      - key: STRIPE_PRICE_MONTH
        sync: false
      - key: STRIPE_PRICE_HALFYEAR
        sync: false
